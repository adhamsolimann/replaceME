{% extends "base.html" %}

{% block title %}Neuen Usecase anlegen{% endblock %}

{% block content %}
    <h3>Hier kann ein neuer Usecase für ihren Anwendungsfall angelegt werden</h3>
    <form action="." method="post">
        <table >
            {{ form.as_p }}
        </table>
        {% csrf_token %}
        <input type="submit" value="Save"/>
    </form>
{% endblock %}
